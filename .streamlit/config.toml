[theme]
base = "dark"
primaryColor = "#BDF575"
backgroundColor = "#090E19"
secondaryBackgroundColor = "#141D2D"
textColor = "#F3F6FC"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 10

[client]
toolbarMode = "minimal"
showErrorDetails = "type"

[browser]
gatherUsageStats = false
